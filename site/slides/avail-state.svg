<svg viewBox="0 0 960 352" role="img" aria-labelledby="as-t as-d" xmlns="http://www.w3.org/2000/svg"><title id="as-t">叢集可用性狀態機</title><desc id="as-d">FE 與 BE 各自的存活數決定可用性：兩層都至少 2 個存活時讀寫正常；BE 只剩 1 個時只讀；FE 只剩 1 個時不可用；master FE 被暫停但連線仍在時進入卡住，直到重新選主或恢復。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5e56"/></marker><marker id="arrow-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#11a679"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M380,128 V176 Q380,184 372,184 H288 Q280,184 280,192 V208" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="301.7" y="167" width="56.6" height="12" rx="2" fill="#fff"/><text x="330" y="176" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">BE 存活 = 1</text><path d="M280,272 V296 Q280,304 288,304 H400 Q408,304 408,296 V128" fill="none" stroke="#4f5e56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="315.7" y="287" width="56.6" height="12" rx="2" fill="#fff"/><text x="344" y="296" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">BE 回到 ≥ 2</text><path d="M500,128 V176 Q500,184 508,184 H592 Q600,184 600,192 V208" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="521.7" y="167" width="56.6" height="12" rx="2" fill="#fff"/><text x="550" y="176" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">FE 存活 = 1</text><path d="M600,272 V296 Q600,304 592,304 H480 Q472,304 472,296 V128" fill="none" stroke="#4f5e56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="507.7" y="287" width="56.6" height="12" rx="2" fill="#fff"/><text x="536" y="296" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">FE 回到 ≥ 2</text><path d="M440,128 V208" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="454.2" y="159" width="83.60000000000001" height="12" rx="2" fill="#fff"/><text x="496" y="168" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">MASTER FE HANG</text><path d="M420,272 V296 Q420,304 428,304 H452 Q460,304 460,296 V128" fill="none" stroke="#4f5e56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="462.2" y="311" width="83.60000000000001" height="12" rx="2" fill="#fff"/><text x="504" y="320" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" fill="#4f5e56" text-anchor="middle">63s 後重新選主 或 恢復</text><path d="M280,208 V184 Q280,176 288,176 H352 Q360,176 360,184 V208" fill="none" stroke="#4f5e56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="300" y="64" width="200" height="64" rx="8" fill="#fff"/><rect x="300" y="64" width="200" height="64" rx="8" fill="rgba(17,166,121,.10)" stroke="#11a679" stroke-width="1.2"/><text x="400.0" y="94.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">讀寫正常</text><text x="400.0" y="108.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">FE ≥ 2 且 BE ≥ 2</text><rect x="200" y="208" width="160" height="64" rx="8" fill="#fff"/><rect x="200" y="208" width="160" height="64" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="280.0" y="238.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">只讀</text><text x="280.0" y="252.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">寫入失敗、SELECT 正常</text><rect x="360" y="208" width="160" height="64" rx="8" fill="#fff"/><rect x="360" y="208" width="160" height="64" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="440.0" y="238.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">卡住</text><text x="440.0" y="252.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">client 等逾時、無回應</text><rect x="520" y="208" width="160" height="64" rx="8" fill="#fff"/><rect x="520" y="208" width="160" height="64" rx="8" fill="#fff" stroke="#d9eee8" stroke-width="1" stroke-dasharray="4,3"/><text x="600.0" y="238.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">不可用</text><text x="600.0" y="252.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">連查詢都失敗</text><text x="60" y="340" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em">* 只讀 + FE 再掛一個 → 不可用（兩層都剩 1/3）；等級由 measure 依故障中最後 30 秒的操作判定</text></svg>
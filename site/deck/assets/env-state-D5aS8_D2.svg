<svg viewBox="0 0 960 336" role="img" aria-labelledby="es-t es-d" xmlns="http://www.w3.org/2000/svg"><title id="es-t">環境狀態機：demo.sh 指令帶來的狀態轉移</title><desc id="es-d">未建立經 up 成為健康；健康經 monitor 成為監控中，經 break 成為故障中，restore 回到健康；stop 與 start 在健康與關機之間切換；down 回到未建立。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5e56"/></marker><marker id="arrow-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#11a679"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="24" cy="152" r="6" fill="#0f1a14"/><path d="M30,152 H60" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M200,152 H300" fill="none" stroke="#11a679" stroke-width="1.2" marker-end="url(#arrow-g)"/><rect x="240.6" y="135" width="18.8" height="12" rx="2" fill="#fff"/><text x="250" y="144" font-family="JetBrains Mono,monospace" font-size="8" fill="#11a679" letter-spacing="0.06em" text-anchor="middle">UP</text><path d="M440,152 H540" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="467.1" y="135" width="45.800000000000004" height="12" rx="2" fill="#fff"/><text x="490" y="144" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">MONITOR</text><path d="M680,152 H780" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="696.3" y="135" width="67.4" height="12" rx="2" fill="#fff"/><text x="730" y="144" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">BREAK (可疊加)</text><path d="M860,184 V216 Q860,224 852,224 H448 Q440,224 440,216 V184" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="589.3" y="207" width="121.4" height="12" rx="2" fill="#fff"/><text x="650" y="216" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">RESTORE (依相反順序還原全部故障)</text><path d="M820,120 V96 Q820,88 828,88 H892 Q900,88 900,96 V120" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="807.4" y="71" width="105.2" height="12" rx="2" fill="#fff"/><text x="860" y="80" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">CRASH → SYSTEMD 重啟</text><path d="M340,184 V248" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="285.2" y="211" width="29.6" height="12" rx="2" fill="#fff"/><text x="300" y="220" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">STOP</text><path d="M400,248 V184" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="410.2" y="211" width="83.60000000000001" height="12" rx="2" fill="#fff"/><text x="452" y="220" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">START (自動回到叢集)</text><path d="M300,280 H140 Q132,280 132,272 V184" fill="none" stroke="#4f5e56" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="147.2" y="263" width="137.60000000000002" height="12" rx="2" fill="#fff"/><text x="216" y="272" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em" text-anchor="middle">DOWN (terraform destroy)</text><rect x="60" y="120" width="140" height="64" rx="8" fill="#fff"/><rect x="60" y="120" width="140" height="64" rx="8" fill="#fff" stroke="#d9eee8" stroke-width="1" stroke-dasharray="4,3"/><text x="130.0" y="150.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">未建立</text><text x="130.0" y="164.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">沒有任何資源</text><rect x="300" y="120" width="140" height="64" rx="8" fill="#fff"/><rect x="300" y="120" width="140" height="64" rx="8" fill="rgba(17,166,121,.10)" stroke="#11a679" stroke-width="1.2"/><text x="370.0" y="150.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">健康</text><text x="370.0" y="164.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">3 FE · 3 BE · 12 replica OK</text><rect x="540" y="120" width="140" height="64" rx="8" fill="#fff"/><rect x="540" y="120" width="140" height="64" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="610.0" y="150.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">監控中</text><text x="610.0" y="164.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">三個 probe 每秒讀寫</text><rect x="780" y="120" width="140" height="64" rx="8" fill="#fff"/><rect x="780" y="120" width="140" height="64" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="850.0" y="150.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">故障中</text><text x="850.0" y="164.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">.state/faults 記錄</text><rect x="300" y="248" width="140" height="64" rx="8" fill="#fff"/><rect x="300" y="248" width="140" height="64" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="370.0" y="278.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">關機</text><text x="370.0" y="292.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">只剩磁碟費</text><text x="60" y="320" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em">* 任一狀態都能 STATUS 查看；--dry-run 不改變狀態</text></svg>
<svg viewBox="0 0 960 176" role="img" aria-labelledby="cf-t cf-d" xmlns="http://www.w3.org/2000/svg"><title id="cf-t">每格實驗的流程</title><desc id="cf-d">每一格依序執行 monitor、30 秒基準、break、觀察、measure、restore、等待健康、再 measure；整個矩陣跑 3 輪，每輪從全部 VM 開機開始。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5e56"/></marker><marker id="arrow-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#11a679"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M112,76 H136" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M232,76 H256" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M352,76 H376" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M472,76 H496" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M592,76 H616" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M712,76 H736" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M832,76 H856" fill="none" stroke="#4f5e56" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="16" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="16" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="64.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">monitor</text><text x="64.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">三個 probe 開始測試</text><rect x="136" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="136" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="184.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">baseline</text><text x="184.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">健康期 30 秒</text><rect x="256" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="256" y="48" width="96" height="56" rx="8" fill="rgba(17,166,121,.10)" stroke="#11a679" stroke-width="1.2"/><text x="304.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">break</text><text x="304.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">製造 1～3 個故障</text><rect x="376" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="376" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="424.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">觀察</text><text x="424.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">90～120 秒</text><rect x="496" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="496" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="544.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">measure</text><text x="544.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">等級 + 中斷秒數</text><rect x="616" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="616" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="664.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">restore</text><text x="664.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">依相反順序還原全部故障</text><rect x="736" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="736" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="784.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">settle</text><text x="784.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">等叢集健康</text><rect x="856" y="48" width="96" height="56" rx="8" fill="#fff"/><rect x="856" y="48" width="96" height="56" rx="8" fill="#fff" stroke="#0f1a14" stroke-width="1"/><text x="904.0" y="74.0" font-family="Inter,Noto Sans TC,sans-serif" font-size="12" font-weight="600" fill="#0f1a14" text-anchor="middle">measure</text><text x="904.0" y="88.0" font-family="JetBrains Mono,monospace" font-size="9" fill="#4f5e56" text-anchor="middle">確認回到讀寫正常</text><text x="16" y="140" font-family="JetBrains Mono,monospace" font-size="8" fill="#4f5e56" letter-spacing="0.06em">每格 3～5 分鐘 · 整個矩陣 16 格 · 跑 3 輪，每輪：全部 VM 開機 → 逐格跑完 → 全部關機 · 結果寫 results/pass-N/&lt;id&gt;/</text></svg>
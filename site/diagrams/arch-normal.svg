<svg viewBox="0 0 960 544" role="img" aria-labelledby="arch-normal-title arch-normal-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="arch-normal-title">Doris 三節點正常狀態架構</title>
    <desc id="arch-normal-desc">一個 client 連到位於三個 zone 的三台 VM，每台 VM 跑一個 FE 與一個 BE；doris-2 的 FE 目前是 master，另外兩個 FE 透過 edit log 同步，三個 BE 之間保有每個 tablet 的3 個 replica。</desc>
    <defs>
      <marker id="an-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="an-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="var(--paper)"/>
    <!-- zones -->
    <g font-family="var(--mono)" font-size="7" letter-spacing="0.14em">
      <rect x="40" y="152" width="240" height="312" rx="8" fill="var(--ink-02)" stroke="var(--rule)" stroke-width="0.8"/>
      <rect x="48" y="156" width="140" height="12" rx="2" fill="var(--paper)"/><text x="118" y="165" fill="var(--soft)" text-anchor="middle">VM DORIS-1 · ASIA-EAST1-A</text>
      <rect x="360" y="152" width="240" height="312" rx="8" fill="var(--ink-02)" stroke="var(--rule)" stroke-width="0.8"/>
      <rect x="368" y="156" width="140" height="12" rx="2" fill="var(--paper)"/><text x="438" y="165" fill="var(--soft)" text-anchor="middle">VM DORIS-2 · ASIA-EAST1-B</text>
      <rect x="680" y="152" width="240" height="312" rx="8" fill="var(--ink-02)" stroke="var(--rule)" stroke-width="0.8"/>
      <rect x="688" y="156" width="140" height="12" rx="2" fill="var(--paper)"/><text x="758" y="165" fill="var(--soft)" text-anchor="middle">VM DORIS-3 · ASIA-EAST1-C</text>
    </g>
    <!-- arrows (before boxes) -->
    <g fill="none" stroke="var(--muted)" stroke-width="1">
      <line x1="480" y1="96" x2="480" y2="184" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#an-arrow-accent)"/>
      <path d="M440,96 V132 Q440,140 432,140 H168 Q160,140 160,148 V184" stroke-dasharray="4,3" marker-end="url(#an-arrow)"/>
      <path d="M520,96 V132 Q520,140 528,140 H792 Q800,140 800,148 V184" stroke-dasharray="4,3" marker-end="url(#an-arrow)"/>
      <line x1="400" y1="216" x2="240" y2="216" stroke-width="1.2" marker-end="url(#an-arrow)"/>
      <line x1="560" y1="216" x2="720" y2="216" stroke-width="1.2" marker-end="url(#an-arrow)"/>
      <line x1="160" y1="248" x2="160" y2="376" marker-end="url(#an-arrow)"/>
      <line x1="480" y1="248" x2="480" y2="376" marker-end="url(#an-arrow)"/>
      <line x1="800" y1="248" x2="800" y2="376" marker-end="url(#an-arrow)"/>
      <line x1="240" y1="408" x2="400" y2="408" stroke-dasharray="4,3" marker-start="url(#an-arrow)" marker-end="url(#an-arrow)"/>
      <line x1="560" y1="408" x2="720" y2="408" stroke-dasharray="4,3" marker-start="url(#an-arrow)" marker-end="url(#an-arrow)"/>
    </g>
    <!-- arrow labels (masked, 8px gap) -->
    <g font-family="var(--mono)" font-size="8" letter-spacing="0.06em" text-anchor="middle">
      <rect x="488" y="124" width="64" height="12" rx="2" fill="var(--paper)"/><text x="520" y="133" fill="var(--accent)">SQL :9030</text>
      <rect x="276" y="120" width="48" height="12" rx="2" fill="var(--paper)"/><text x="300" y="129" fill="var(--soft)">FAILOVER</text>
      <rect x="636" y="120" width="48" height="12" rx="2" fill="var(--paper)"/><text x="660" y="129" fill="var(--soft)">FAILOVER</text>
      <rect x="280" y="196" width="80" height="12" rx="2" fill="var(--paper)"/><text x="320" y="205" fill="var(--soft)">EDIT LOG :9010</text>
      <rect x="600" y="196" width="80" height="12" rx="2" fill="var(--paper)"/><text x="640" y="205" fill="var(--soft)">EDIT LOG :9010</text>
      <rect x="488" y="300" width="88" height="12" rx="2" fill="var(--paper)"/><text x="532" y="309" fill="var(--soft)">FE→BE RPC :9050</text>
      <rect x="288" y="388" width="64" height="12" rx="2" fill="var(--paper)"/><text x="320" y="397" fill="var(--soft)">REPLICA ×3</text>
      <rect x="608" y="388" width="64" height="12" rx="2" fill="var(--paper)"/><text x="640" y="397" fill="var(--soft)">REPLICA ×3</text>
    </g>
    <!-- client -->
    <rect x="400" y="40" width="160" height="56" rx="6" fill="var(--paper)"/>
    <rect x="400" y="40" width="160" height="56" rx="6" fill="var(--muted-10)" stroke="var(--soft)" stroke-width="1"/>
    <text x="480" y="64" fill="var(--ink)" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Client / BI 工具</text>
    <text x="480" y="82" fill="var(--muted)" font-size="9" font-family="var(--mono)" text-anchor="middle">hosts=doris-1,doris-2,doris-3</text>
    <!-- FE boxes -->
    <g font-family="var(--sans)" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="80" y="184" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="80" y="184" width="160" height="64" rx="6" fill="var(--white)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="88" y="190" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink-30)" stroke-width="0.8"/><text x="98" y="199" fill="var(--muted)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">FE</text>
      <text x="160" y="214" fill="var(--ink)">doris-1 FE</text><text x="160" y="232" fill="var(--muted)" font-size="9" font-weight="400" font-family="var(--mono)">FOLLOWER</text>

      <rect x="400" y="184" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="400" y="184" width="160" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
      <rect x="408" y="190" width="20" height="12" rx="2" fill="transparent" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="0.8"/><text x="418" y="199" fill="var(--accent)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">FE</text>
      <text x="480" y="214" fill="var(--ink)">doris-2 FE</text><text x="480" y="232" fill="var(--accent)" font-size="9" font-weight="500" font-family="var(--mono)">MASTER（當下）</text>

      <rect x="720" y="184" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="720" y="184" width="160" height="64" rx="6" fill="var(--white)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="728" y="190" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink-30)" stroke-width="0.8"/><text x="738" y="199" fill="var(--muted)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">FE</text>
      <text x="800" y="214" fill="var(--ink)">doris-3 FE</text><text x="800" y="232" fill="var(--muted)" font-size="9" font-weight="400" font-family="var(--mono)">FOLLOWER</text>
    </g>
    <!-- BE boxes -->
    <g font-family="var(--sans)" font-size="12" font-weight="600" text-anchor="middle">
      <rect x="80" y="376" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="80" y="376" width="160" height="64" rx="6" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/>
      <rect x="88" y="382" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink-30)" stroke-width="0.8"/><text x="98" y="391" fill="var(--muted)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">BE</text>
      <text x="160" y="406" fill="var(--ink)">doris-1 BE</text><text x="160" y="424" fill="var(--muted)" font-size="9" font-weight="400" font-family="var(--mono)">tablet replica 1/3</text>

      <rect x="400" y="376" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="400" y="376" width="160" height="64" rx="6" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/>
      <rect x="408" y="382" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink-30)" stroke-width="0.8"/><text x="418" y="391" fill="var(--muted)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">BE</text>
      <text x="480" y="406" fill="var(--ink)">doris-2 BE</text><text x="480" y="424" fill="var(--muted)" font-size="9" font-weight="400" font-family="var(--mono)">tablet replica 2/3</text>

      <rect x="720" y="376" width="160" height="64" rx="6" fill="var(--paper)"/><rect x="720" y="376" width="160" height="64" rx="6" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/>
      <rect x="728" y="382" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink-30)" stroke-width="0.8"/><text x="738" y="391" fill="var(--muted)" font-size="7" font-weight="500" font-family="var(--mono)" letter-spacing="0.08em">BE</text>
      <text x="800" y="406" fill="var(--ink)">doris-3 BE</text><text x="800" y="424" fill="var(--muted)" font-size="9" font-weight="400" font-family="var(--mono)">tablet replica 3/3</text>
    </g>
    <!-- legend -->
    <line x1="40" y1="492" x2="920" y2="492" stroke="var(--rule)" stroke-width="0.8"/>
    <g font-family="var(--mono)" font-size="8" fill="var(--muted)">
      <text x="40" y="512" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="504" width="12" height="10" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/><text x="140" y="512">FE master（當下）</text>
      <rect x="264" y="504" width="12" height="10" rx="2" fill="var(--white)" stroke="var(--ink)" stroke-width="1"/><text x="284" y="512">FE follower</text>
      <rect x="376" y="504" width="12" height="10" rx="2" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/><text x="396" y="512">BE（資料replica）</text>
      <line x1="512" y1="509" x2="536" y2="509" stroke="var(--accent)" stroke-width="1.2"/><text x="544" y="512">client 目前連線</text>
      <line x1="668" y1="509" x2="692" y2="509" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/><text x="700" y="512">備援 / replica同步</text>
    </g>
  </svg>
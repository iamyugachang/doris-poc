[defaults]
inventory = inventory.ini
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
forks = 10
stdout_callback = default
display_skipped_hosts = False
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ConnectTimeout=15
